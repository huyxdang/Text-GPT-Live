<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Co-write with a model that listens while it writes." />
    <title>Text GPT-Live — Editor</title>
    <link rel="stylesheet" href="/static/styles.css?v=text-gpt-live-2" />
    <link rel="stylesheet" href="/static/editor.css" />
  </head>
  <body data-view="current">
    <div class="shell">
      <header class="masthead">
        <div class="identity">
          <h1>Text GPT-Live <span class="editor-tag">editor</span></h1>
        </div>
        <div class="masthead-side">
          <span class="error-line" id="error-line" role="alert" hidden></span>
        </div>
      </header>

      <main class="editor-workbench" aria-label="Co-writing editor">
        <section class="document-bay" aria-labelledby="document-heading">
          <div class="section-heading">
            <h2 id="document-heading">Document<span class="decide-pulse" id="writer-pulse" aria-hidden="true" hidden></span></h2>
            <div class="document-controls">
              <span class="writer-status" id="writer-status">idle</span>
              <button class="button button--small button--quiet" id="undo-button" type="button" disabled>Undo</button>
            </div>
          </div>
          <div class="document-canvas" id="document-canvas" aria-live="polite"></div>
        </section>

        <section class="assistant-bay" aria-label="Assistant action">
          <div class="current-action" id="current-action" data-action="waiting" aria-live="polite">
            <div class="current-action__header">
              <h2>Assistant<span class="decide-pulse" id="decide-pulse" aria-hidden="true" hidden></span></h2>
            </div>
            <div class="current-action__body">
              <p class="current-action__status" id="current-action-title"></p>
              <code id="current-action-value">Model is silent</code>
              <code class="current-action__raw" id="current-action-raw" hidden></code>
            </div>
          </div>
        </section>
      </main>

      <footer class="talk-bar">
        <button class="button button--mic" id="mic-button" type="button" aria-pressed="false" title="Speak">
          <span aria-hidden="true">●</span><span class="sr-only">Toggle microphone</span>
        </button>
        <input
          id="talk-input"
          type="text"
          autocomplete="off"
          maxlength="2000"
          placeholder="Talk to the editor — Enter sends"
        />
        <button class="button button--primary" id="run-button" type="button">Start</button>
        <button class="button button--quiet" id="reset-button" type="button">Clear</button>
      </footer>
    </div>

    <script src="/static/editor.js?v=3" defer></script>
  </body>
</html>
